; Standalone playtest builds. No signing credentials are stored here.
[preset.0]
name="Linux Playtest"
platform="Linux"
runnable=true
custom_features="standalone"
advanced_options=true
export_filter="all_resources"
include_filter="release/build_info.json,campaign/audio/manifest.json"
exclude_filter="artifacts/*,tools/*,tests/*,campaign/tests/*,validation/*,*.md"
export_path=""
script_export_mode=2
[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=0
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true

[preset.1]
name="Windows Playtest"
platform="Windows Desktop"
runnable=true
custom_features="standalone"
advanced_options=true
export_filter="all_resources"
include_filter="release/build_info.json,campaign/audio/manifest.json"
exclude_filter="artifacts/*,tools/*,tests/*,campaign/tests/*,validation/*,*.md"
export_path=""
script_export_mode=2
[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
debug/export_console_wrapper=2
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
codesign/enable=false
application/modify_resources=false

[preset.2]
name="macOS Playtest"
platform="macOS"
runnable=true
custom_features="standalone"
advanced_options=true
export_filter="all_resources"
include_filter="release/build_info.json,campaign/audio/manifest.json"
exclude_filter="artifacts/*,tools/*,tests/*,campaign/tests/*,validation/*,*.md"
export_path=""
script_export_mode=2
[preset.2.options]
export/distribution_type=1
binary_format/architecture="universal"
debug/export_console_wrapper=0
application/bundle_identifier="com.scomofo.dragonforge.reconnection"
application/short_version="0.2.0"
application/version="0.2.0"
codesign/codesign=1
codesign/entitlements/disable_library_validation=true
notarization/notarization=0
