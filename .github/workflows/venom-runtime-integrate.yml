name: Integrate Nox Venom runtime
on:
  pull_request:
    paths:
      - '.github/workflows/venom-runtime-integrate.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-venom-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-venom-guardian
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact runtime integration edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def rep(path,old,new):
              p=Path(path);text=p.read_text();count=text.count(old)
              assert count==1,f'{path}: expected 1 occurrence, got {count}: {old[:90]!r}'
              p.write_text(text.replace(old,new,1))
          # Imported guardian controller.
          rep('dragon-forge-nextgen/campaign/dragon.gd',
              'const StoneRig = preload("res://campaign/stone_rig.gd")\n',
              'const StoneRig = preload("res://campaign/stone_rig.gd")\nconst VenomRig = preload("res://campaign/venom_rig.gd")\n')
          rep('dragon-forge-nextgen/campaign/dragon.gd','if not id in ["fire","ice","storm","stone"]:',
              'if not id in ["fire","ice","storm","stone","venom"]:')
          rep('dragon-forge-nextgen/campaign/dragon.gd',
              'if id == "stone":\n\t\t\tnext = StoneRig.new()\n\t\telif id == "storm":',
              'if id == "venom":\n\t\t\tnext = VenomRig.new()\n\t\telif id == "stone":\n\t\t\tnext = StoneRig.new()\n\t\telif id == "storm":')
          # Correct names for non-evolving roster entries.
          rep('dragon-forge-nextgen/campaign/growth.gd',
              'static func form_name(guardian: String, evolved: bool) -> String:\n\tif guardian == "stone": return "Cairn"',
              'static func form_name(guardian: String, evolved: bool) -> String:\n\tif guardian == "venom": return "Nox"\n\tif guardian == "stone": return "Cairn"')
          rep('dragon-forge-nextgen/campaign/audio/synth.gd',
              '{"fire":.78,"ice":1.55,"storm":1.08,"stone":.58}.get(guardian,1.0)',
              '{"fire":.78,"ice":1.55,"storm":1.08,"stone":.58,"venom":.90}.get(guardian,1.0)')
          # Separate Frozen Vault culture plinth; the Ice egg remains untouched.
          rep('dragon-forge-nextgen/campaign/room.gd','var stone_imprint: Node3D\n','var stone_imprint: Node3D\nvar venom_culture: Node3D\n')
          rep('dragon-forge-nextgen/campaign/room.gd',
              '\t\tif definition.id=="frozen-vault":\n\t\t\tvar plinth=_station("ice_egg","RESCUE ICE EGG",Vector3(6,0,-4),"incubator")\n\t\t\tice_egg=IceEgg.instantiate();plinth.add_child(ice_egg)\n',
              '\t\tif definition.id=="frozen-vault":\n\t\t\tvar plinth=_station("ice_egg","RESCUE ICE EGG",Vector3(6,0,-4),"incubator")\n\t\t\tice_egg=IceEgg.instantiate();plinth.add_child(ice_egg)\n\t\t\tvenom_culture=_station("venom_culture","VENOM CULTURE",Vector3(-5,0,-4),"core_socket")\n\t\t\tGeo.orb(venom_culture,Vector3(0,1.55,0),.31,Geo.material(Color("9bd954"),1.15,true))\n\t\t\tGeo.ring(venom_culture,Vector3.UP*.18,1.0,Geo.material(Color("78528e"),.55,true),.07)\n')
          rep('dragon-forge-nextgen/campaign/room.gd',
              '\tif is_instance_valid(stone_imprint): stone_imprint.visible = not state.get("stone_imprint_recovered",false)\n',
              '\tif is_instance_valid(stone_imprint): stone_imprint.visible = not state.get("stone_imprint_recovered",false)\n\tif is_instance_valid(venom_culture): venom_culture.visible = state.get("ice_rescued",false) and not state.get("venom_culture_recovered",false)\n')
          rep('dragon-forge-nextgen/campaign/room.gd',
              '\t\tif station.kind=="ice_egg":station.node.visible=not state.get("ice_rescued",false)\n',
              '\t\tif station.kind=="ice_egg":station.node.visible=not state.get("ice_rescued",false)\n\t\tif station.kind=="venom_culture":station.node.visible=state.get("ice_rescued",false) and not state.get("venom_culture_recovered",false)\n')
          # Enemy-owned Toxin: status remains target-local through swaps and shield reclosure.
          rep('dragon-forge-nextgen/campaign/enemy.gd','const Roles = preload("res://campaign/enemy_roles.gd")\n',
              'const Roles = preload("res://campaign/enemy_roles.gd")\nconst GuardianCombat = preload("res://campaign/guardian_combat.gd")\n')
          rep('dragon-forge-nextgen/campaign/enemy.gd','var charged = 0.0\nvar impact_flash = 0.0\n',
              'var charged = 0.0\nvar toxin = 0\nvar toxin_time = 0.0\nvar toxin_tick = 1.0\nvar impact_flash = 0.0\n')
          rep('dragon-forge-nextgen/campaign/enemy.gd',
              '\tchilled=maxf(0.0,chilled-delta)\n\tcharged=maxf(0.0,charged-delta)\n\tvar role_tag',
              '\tchilled=maxf(0.0,chilled-delta)\n\tcharged=maxf(0.0,charged-delta)\n\ttick_toxin(delta)\n\tif hp<=0.0:return\n\tvar role_tag')
          rep('dragon-forge-nextgen/campaign/enemy.gd',
              '\tlabel.text=spec.get("name","Guardian")+role_tag+(" / CHILLED" if chilled>0.0 else "") + (" / CHARGED" if charged>0.0 else "")\n',
              '\tlabel.text=spec.get("name","Guardian")+role_tag+(" / CHILLED" if chilled>0.0 else "") + (" / CHARGED" if charged>0.0 else "") + (" / TOXIN x%d" % toxin if toxin>0 else "")\n')
          rep('dragon-forge-nextgen/campaign/enemy.gd','\n\nfunc _role_direction(role: String, toward: Vector3) -> Vector3:\n',
              '''\n\nfunc tick_toxin(delta: float) -> void:\n\tif toxin<=0 or toxin_time<=0.0 or hp<=0.0:return\n\tvar dt=minf(maxf(delta,0.0) if is_finite(delta) else 0.0,toxin_time)\n\ttoxin_time=maxf(0.0,toxin_time-dt);toxin_tick-=dt\n\twhile toxin_tick<=0.0 and toxin>0 and hp>0.0:\n\t\ttoxin_tick+=1.0\n\t\ttake_hit(GuardianCombat.toxin_tick_damage()*float(toxin),true)\n\tif toxin_time<=0.0:toxin=0;toxin_tick=1.0\n\nfunc apply_toxin() -> void:\n\tif toxin<=0:toxin_tick=1.0\n\ttoxin=GuardianCombat.toxin_stacks(toxin+1);toxin_time=GuardianCombat.toxin_duration()\n\thit_feedback.emit(global_position,"TOXIN x%d" % toxin,false)\n\nfunc _role_direction(role: String, toward: Vector3) -> Vector3:\n''')
          old='''func element_hit(amount: float,guardian: String,id: String,chill_duration: float = 3.0, charge_duration: float = 4.0) -> float:\n\tvar shatter = guardian=="fire" and id!="wall" and chilled>0.0\n\tvar discharge = guardian == "storm" and id == "burst" and charged > 0.0\n\tvar actual=take_hit(amount*(1.4 if shatter else (1.5 if discharge else 1.0)))\n\tif actual<=0.0:return 0.0\n\tif discharge:\n\t\tcharged = 0.0\n\t\thit_feedback.emit(global_position, "DISCHARGE", false)\n\telif guardian == "storm" and id in ["breath", "wall"] and hp > 0.0:\n\t\tcharged = maxf(charged, clampf(charge_duration, 0.0, 6.0))\n\tif shatter:\n\t\tchilled=0.0\n\t\thit_feedback.emit(global_position,"SHATTER",false)\n\telif guardian=="ice" and id in ["breath","wall"] and hp>0.0:\n\t\tchilled=maxf(chilled,clampf(chill_duration,0.0,4.5))\n\treturn actual'''
          new='''func element_hit(amount: float,guardian: String,id: String,chill_duration: float = 3.0, charge_duration: float = 4.0) -> float:\n\tvar shatter = guardian=="fire" and id!="wall" and chilled>0.0\n\tvar discharge = guardian == "storm" and id == "burst" and charged > 0.0\n\tvar bloom_stacks = toxin if guardian=="venom" and id=="burst" else 0\n\tvar multiplier=1.4 if shatter else (1.5 if discharge else (GuardianCombat.toxin_burst_multiplier(bloom_stacks) if guardian=="venom" and id=="burst" else 1.0))\n\tvar actual=take_hit(amount*multiplier)\n\tif actual<=0.0:return 0.0\n\tif discharge:\n\t\tcharged = 0.0\n\t\thit_feedback.emit(global_position, "DISCHARGE", false)\n\telif guardian == "storm" and id in ["breath", "wall"] and hp > 0.0:\n\t\tcharged = maxf(charged, clampf(charge_duration, 0.0, 6.0))\n\tif shatter:\n\t\tchilled=0.0\n\t\thit_feedback.emit(global_position,"SHATTER",false)\n\telif guardian=="ice" and id in ["breath","wall"] and hp>0.0:\n\t\tchilled=maxf(chilled,clampf(chill_duration,0.0,4.5))\n\tif guardian=="venom":\n\t\tif id=="burst" and bloom_stacks>0:\n\t\t\ttoxin=0;toxin_time=0.0;toxin_tick=1.0;hit_feedback.emit(global_position,"SEPTIC BLOOM x%d" % bloom_stacks,false)\n\t\telif id in ["claw","breath","wall"] and hp>0.0:\n\t\t\tapply_toxin()\n\treturn actual'''
          rep('dragon-forge-nextgen/campaign/enemy.gd',old,new)
          # World interactions and actual technique routing.
          rep('dragon-forge-nextgen/campaign/world.gd','\t\t"stone_imprint":return "Recover the dormant Stone imprint"\n',
              '\t\t"stone_imprint":return "Recover the dormant Stone imprint"\n\t\t"venom_culture":return "Recover the preserved Venom culture"\n')
          rep('dragon-forge-nextgen/campaign/world.gd',
              '\t\t"stone_imprint":\n\t\t\tif Fusion.recover_stone(campaign):\n\t\t\t\t_save();level.refresh(campaign);hud.show_stone_recovered()\n',
              '\t\t"stone_imprint":\n\t\t\tif Fusion.recover_stone(campaign):\n\t\t\t\t_save();level.refresh(campaign);hud.show_stone_recovered()\n\t\t"venom_culture":\n\t\t\tif Fusion.recover_venom(campaign):\n\t\t\t\t_save();level.refresh(campaign);hud.show_venom_recovered()\n')
          rep('dragon-forge-nextgen/campaign/world.gd',
              '\t\tif owner_id=="fire": _place_wall(origin,direction)\n\t\telif owner_id=="ice": _place_frost(origin,direction)\n\t\telif owner_id=="storm": _place_static(origin,direction)\n\t\telse: _place_bulwark(origin,direction)\n',
              '\t\tif owner_id=="fire": _place_wall(origin,direction)\n\t\telif owner_id=="ice": _place_frost(origin,direction)\n\t\telif owner_id=="storm": _place_static(origin,direction)\n\t\telif owner_id=="stone": _place_bulwark(origin,direction)\n\t\telse: _place_venom(origin,direction)\n')
          rep('dragon-forge-nextgen/campaign/world.gd',
              '\tif owner_id=="stone":\n\t\t_stone_contact(id,origin,direction,rule.range)\n\tif owner_id=="ice":',
              '\tif owner_id=="stone":\n\t\t_stone_contact(id,origin,direction,rule.range)\n\tif owner_id=="venom":\n\t\t_venom_contact(id,origin,direction,rule.range)\n\tif owner_id=="ice":')
          rep('dragon-forge-nextgen/campaign/world.gd',
              'func hatch_stone() -> bool:\n\tif not can_fuse() or not Fusion.hatch_stone(campaign):return false\n\tsound("hatch","fire",3,true);_save();hud.show_fusion();return true\n\nfunc equip_reserve',
              'func hatch_stone() -> bool:\n\tif not can_fuse() or not Fusion.hatch_stone(campaign):return false\n\tsound("hatch","fire",3,true);_save();hud.show_fusion();return true\n\nfunc forge_venom() -> bool:\n\tif not can_fuse() or not Fusion.forge_venom(campaign):return false\n\tsound("fusion","venom",3,true);_save();hud.show_fusion();return true\n\nfunc hatch_venom() -> bool:\n\tif not can_fuse() or not Fusion.hatch_venom(campaign):return false\n\tsound("hatch","venom",3,true);_save();hud.show_fusion();return true\n\nfunc equip_reserve')
          rep('dragon-forge-nextgen/campaign/world.gd','\nfunc _stone_contact(id:String,origin:Vector3,direction:Vector3,reach:float)->void:\n',
              '''\nfunc _place_venom(origin:Vector3,direction:Vector3)->void:\n\tvar at=origin+direction*4.0\n\tvar hit=get_world_3d().direct_space_state.intersect_ray(PhysicsRayQueryParameters3D.create(origin+Vector3.UP,at+Vector3.UP,1))\n\tif not hit.is_empty():at=hit.position-direction*.6\n\tat.y=0.0\n\tvar marker=effects.decal(at,2.5,Color("668d42"));Geo.ring(marker,Vector3.UP*.05,2.5,Geo.material(Color("a4dc5d"),.5,true),.06)\n\tfor i in range(7):\n\t\tvar a=TAU*i/7.0;Geo.orb(marker,Vector3(sin(a)*1.65,.12,cos(a)*1.65),.10,Geo.material(Color("9cd855"),.7,true))\n\twalls.append({"at":at,"ttl":3.6,"tick":0.0,"damage":campaign_damage("wall"),"guardian":"venom","node":marker})\n\nfunc _venom_contact(id:String,origin:Vector3,direction:Vector3,reach:float)->void:\n\tif id=="burst":effects.pulse(origin,reach,Color("a5dc60"));return\n\tvar node=Node3D.new();add_child(node);effects._reserve(node);var mat=Geo.material(Color("a8df66"),.65,true)\n\tvar count=3 if id=="claw" else 11\n\tfor i in range(count):\n\t\tvar d=1.0+i*.52\n\t\tif d>reach or not line_clear(origin,origin+direction*d):break\n\t\tvar side=direction.cross(Vector3.UP)*(.10 if i%2 else -.10)\n\t\tGeo.orb(node,origin+direction*d+side+Vector3.UP*(.55+.03*(i%3)),.10 if id=="claw" else .075,mat)\n\tnode.create_tween().tween_interval(.30).finished.connect(node.queue_free)\n\nfunc _stone_contact(id:String,origin:Vector3,direction:Vector3,reach:float)->void:\n''')
          # Guidance keeps Ice egg first, then exposes the culture.
          rep('dragon-forge-nextgen/campaign/world.gd',
              '\telif r.role=="forge":\n\t\tif campaign.stone_forged and not campaign.guardians.has("stone"):',
              '\telif r.role=="forge":\n\t\tif campaign.venom_forged and not campaign.guardians.has("venom"):\n\t\t\treturn {"title":"A Venom guardian is ready to hatch","detail":"Visit Resonance Fusion to awaken Nox. Rime and your current expedition pair are retained.","target":Fusion.STATION,"marker":"HATCH NOX","index":mini(campaign.installed.size(),5)}\n\t\tif campaign.venom_culture_recovered and not campaign.venom_forged and Fusion.venom_reason(campaign)=="" and campaign.cores.size()==campaign.installed.size():\n\t\t\treturn {"title":"The Venom culture can be stabilized","detail":"Rime can stabilize the preserved culture at Resonance Fusion. Canonical Ice + Venom remains Venom; Rime is retained.","target":Fusion.STATION,"marker":"VENOM RESONANCE","index":mini(campaign.installed.size(),5)}\n\t\tif campaign.stone_forged and not campaign.guardians.has("stone"):')
          rep('dragon-forge-nextgen/campaign/world.gd',
              '\telif r.id=="frozen-vault" and not campaign.ice_rescued:\n\t\ttitle="A second heartbeat in the ice"\n\t\tdetail="Rescue the egg from the cyan plinth. Return to the Forge to hatch Rime, your first reserve guardian."\n\t\ttarget=Vector3(6,0,-4)\n\t\tmarker="ICE GUARDIAN EGG"\n',
              '\telif r.id=="frozen-vault" and not campaign.ice_rescued:\n\t\ttitle="A second heartbeat in the ice"\n\t\tdetail="Rescue the egg from the cyan plinth. Return to the Forge to hatch Rime, your first reserve guardian."\n\t\ttarget=Vector3(6,0,-4)\n\t\tmarker="ICE GUARDIAN EGG"\n\telif r.id=="frozen-vault" and not campaign.venom_culture_recovered:\n\t\ttitle="A sealed culture beneath the frost"\n\t\tdetail="Recover the Venom culture from the separate green plinth. Rime can stabilize it later at Resonance Fusion."\n\t\ttarget=Fusion.VENOM_CULTURE\n\t\tmarker="VENOM CULTURE"\n')
          # HUD: fifth roster, toxin readout and third explicit fusion recipe.
          rep('dragon-forge-nextgen/campaign/hud.gd','STONE RESONANCE   /   22 ROOMS   /   FOUR GUARDIANS, TWO FIELD SLOTS',
              'VENOM RESONANCE   /   22 ROOMS   /   FIVE GUARDIANS, TWO FIELD SLOTS')
          rep('dragon-forge-nextgen/campaign/hud.gd',
              '\t\tif active_id=="ice":\n\t\t\tif id=="breath":card.cost.text="%d + CHILL / %d heat" % [roundi(world.campaign_damage(id)),roundi(GuardianCombat.heat_cost(actor.state,id))]\n\t\t\telif id=="wall":card.cost.text="%d/tick + CHILL / %d heat" % [roundi(world.campaign_damage(id)),roundi(GuardianCombat.heat_cost(actor.state,id))]\n\t\t\telif id=="burst":card.cost.text="55%% protection / %d seconds" % int(GuardianCombat.ward_duration(actor.state))\n',
              '\t\tif active_id=="ice":\n\t\t\tif id=="breath":card.cost.text="%d + CHILL / %d heat" % [roundi(world.campaign_damage(id)),roundi(GuardianCombat.heat_cost(actor.state,id))]\n\t\t\telif id=="wall":card.cost.text="%d/tick + CHILL / %d heat" % [roundi(world.campaign_damage(id)),roundi(GuardianCombat.heat_cost(actor.state,id))]\n\t\t\telif id=="burst":card.cost.text="55%% protection / %d seconds" % int(GuardianCombat.ward_duration(actor.state))\n\t\tif active_id=="venom":\n\t\t\tif id in ["claw","breath"]:card.cost.text="%d + TOXIN / %d heat" % [roundi(world.campaign_damage(id)),roundi(GuardianCombat.heat_cost(actor.state,id))]\n\t\t\telif id=="wall":card.cost.text="%d/tick + TOXIN / %d heat" % [roundi(world.campaign_damage(id)),roundi(GuardianCombat.heat_cost(actor.state,id))]\n\t\t\telif id=="burst":card.cost.text="%d / +25%% per TOXIN / %d heat" % [roundi(world.campaign_damage(id)),roundi(GuardianCombat.heat_cost(actor.state,id))]\n')
          rep('dragon-forge-nextgen/campaign/hud.gd','\tif foe.charged>0.0:\n\t\tenemy_readout.text+="  /  CHARGED %.1fs" % foe.charged\n',
              '\tif foe.charged>0.0:\n\t\tenemy_readout.text+="  /  CHARGED %.1fs" % foe.charged\n\tif foe.toxin>0:\n\t\tenemy_readout.text+="  /  TOXIN x%d %.1fs" % [foe.toxin,foe.toxin_time]\n')
          rep('dragon-forge-nextgen/campaign/hud.gd','\tfor id in ["fire","ice","storm","stone"]:\n',
              '\tfor id in ["fire","ice","storm","stone","venom"]:\n')
          rep('dragon-forge-nextgen/campaign/hud.gd',
              '{"fire":GOLD,"ice":TEAL,"storm":Color("c4b1fa"),"stone":Color("c8ad7c")}[id]',
              '{"fire":GOLD,"ice":TEAL,"storm":Color("c4b1fa"),"stone":Color("c8ad7c"),"venom":Color("a8db61")}[id]')
          rep('dragon-forge-nextgen/campaign/hud.gd',
              'var tips={"fire":"Powers heat relays. Direct Fire hits shatter Chill for +40% once.","ice":"Chills exposed enemies. Aegis protects Rime, even after swapping.","storm":"Lance / Well charge enemies. Discharge consumes Charge for +50% once.","stone":"Guard landed hits to build up to 3 Resolve. Earthshatter gains +20% per Resolve and spends it only on a landed hit."}',
              'var tips={"fire":"Powers heat relays. Direct Fire hits shatter Chill for +40% once.","ice":"Chills exposed enemies. Aegis protects Rime, even after swapping.","storm":"Lance / Well charge enemies. Discharge consumes Charge for +50% once.","stone":"Guard landed hits to build up to 3 Resolve. Earthshatter gains +20% per Resolve and spends it only on a landed hit.","venom":"Fang, Spit and Cloud build Toxin. Septic Bloom gains +25% per stack and consumes stacks only when it lands."}')
          rep('dragon-forge-nextgen/campaign/hud.gd',
              '\t\telse:\n\t\t\t_wrapped(col,"Recover the Stone imprint in Admin Vault, then temper it with Magma at Resonance Fusion. Fire + Stone remains Stone; Magma is retained.",17,PAPER,272)\n\t\t\t_button(col,"View fusion recipes").pressed.connect(show_fusion)\n',
              '\t\telif id=="stone":\n\t\t\t_wrapped(col,"Recover the Stone imprint in Admin Vault, then temper it with Magma at Resonance Fusion. Fire + Stone remains Stone; Magma is retained.",17,PAPER,272)\n\t\t\t_button(col,"View fusion recipes").pressed.connect(show_fusion)\n\t\telse:\n\t\t\t_wrapped(col,"Rescue Rime, then recover the preserved Venom culture from Frozen Vault. Canonical Ice + Venom remains Venom; Rime is retained.",17,PAPER,272)\n\t\t\t_button(col,"View fusion recipes").pressed.connect(show_fusion)\n')
          rep('dragon-forge-nextgen/campaign/hud.gd','\t_wrapped(overlay_column,"The Forge now holds two explicit, non-destructive resonance recipes. No random failure, parent sacrifice or salvage cost.",18,PAPER)\n',
              '\t_wrapped(overlay_column,"The Forge now holds three explicit, non-destructive resonance recipes. No random failure, parent sacrifice or salvage cost.",18,PAPER)\n')
          rep('dragon-forge-nextgen/campaign/hud.gd',
              '\t_wrapped(overlay_column,"CAIRN / Granite Knuckle • Fault Line • Bulwark Field • Earthshatter\\nGuard landed hits to build Resolve (max 3). Earthshatter gains +20% damage per Resolve and spends it only when damage lands; a closed shield preserves the stored Resolve.",17,MUTED)\n',
              '\t_wrapped(overlay_column,"CAIRN / Granite Knuckle • Fault Line • Bulwark Field • Earthshatter\\nGuard landed hits to build Resolve (max 3). Earthshatter gains +20% damage per Resolve and spends it only when damage lands; a closed shield preserves the stored Resolve.",17,MUTED)\n\t_label(overlay_column,"ICE + VENOM CULTURE = VENOM / NOX",22,Color("a8db61"))\n\tif c.guardians.has("venom"):\n\t\t_label(overlay_column,"NOX / RECRUITED",18,TEAL)\n\telif c.venom_forged:\n\t\tvar hatch3=_button(overlay_column,"Awaken Nox / free");hatch3.disabled=not world.can_fuse();hatch3.pressed.connect(func():world.hatch_venom())\n\telse:\n\t\t_wrapped(overlay_column,Fusion.venom_reason(c) if Fusion.venom_reason(c)!="" else "READY / Preserved Venom culture + Rime. Canonical Ice + Venom remains Venom.",16,GOLD)\n\t\tvar forge3=_button(overlay_column,"Stabilize Venom culture / keep Rime");forge3.disabled=Fusion.venom_reason(c)!="" or not world.can_fuse();forge3.pressed.connect(func():world.forge_venom())\n\t_wrapped(overlay_column,"NOX / Toxin Fang • Acid Spit • Toxic Cloud • Septic Bloom\\nBuild up to 3 Toxin stacks. Existing Toxin ticks after shields re-close; Bloom gains +25% per stack and consumes them only when the Bloom lands.",17,MUTED)\n')
          rep('dragon-forge-nextgen/campaign/hud.gd','\nfunc show_fusion() -> void:\n',
              '''\nfunc show_venom_recovered()->void:\n\t_open_overlay("venom")\n\t_label(overlay_column,"SOMETHING LIVING UNDER THE ICE",31,Color("a8db61"))\n\t_wrapped(overlay_column,"A preserved Venom culture survived beside the frozen guardian archive. It is not Rime's egg and does not replace any cache reward.",21,PAPER)\n\t_wrapped(overlay_column,"Return to Resonance Fusion after three sector cores are restored. Rime stabilizes the culture non-destructively: canonical Ice + Venom remains Venom.",18,MUTED)\n\t_button(overlay_column,"Return to the Forge").pressed.connect(func():world.return_to_forge())\n\t_button(overlay_column,"Keep exploring").pressed.connect(close_overlay)\n\nfunc show_fusion() -> void:\n''')
          # Inspector and permanent native regression runner.
          rep('dragon-forge-nextgen/validation/character_inspection.gd',
              '"tempest_arc", "stone_guardian", "buffer_overflow"',
              '"tempest_arc", "stone_guardian", "venom_guardian", "buffer_overflow"')
          rep('dragon-forge-nextgen/validation/character_inspection.gd',
              '\telif actor_id == "stone_guardian":\n\t\tmodel = load("res://campaign/stone/stone_guardian.glb").instantiate();add_child(model)\n\telse:',
              '\telif actor_id == "stone_guardian":\n\t\tmodel = load("res://campaign/stone/stone_guardian.glb").instantiate();add_child(model)\n\telif actor_id == "venom_guardian":\n\t\tmodel = load("res://campaign/venom/venom_guardian.glb").instantiate();add_child(model)\n\telse:')
          rep('dragon-forge-nextgen/validation/character_inspection.gd',
              '\tif actor_id in ["ice_guardian","rime_evolved"]:\n\t\tfocus=[Vector3(0,1.0,.3),Vector3(0,1.1,-.5),Vector3(0,.5,.4),Vector3(0,1.2,-1.2),Vector3(0,.9,1.1)][index]\n',
              '\tif actor_id in ["ice_guardian","rime_evolved"]:\n\t\tfocus=[Vector3(0,1.0,.3),Vector3(0,1.1,-.5),Vector3(0,.5,.4),Vector3(0,1.2,-1.2),Vector3(0,.9,1.1)][index]\n\tif actor_id=="venom_guardian":\n\t\tfocus=[Vector3(0,.9,.25),Vector3(0,1.18,-.55),Vector3(0,.35,.3),Vector3(0,1.35,-1.05),Vector3(0,.8,1.0)][index]\n')
          rep('dragon-forge-nextgen/tools/test_bosses.sh','campaign/tests/venom_tests.gd campaign/tests/boss_tests.gd',
              'campaign/tests/venom_tests.gd campaign/tests/venom_runtime_tests.gd campaign/tests/boss_tests.gd')
          PY
          git diff --check
      - name: Install pinned authoring and validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          python -m pip install -r dragon-forge-nextgen/tools/art-requirements.txt
          npm install --prefix /tmp/gltf gltf-validator@2.0.0-dev.3.10
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Bake and independently validate Nox
        shell: bash
        run: |
          set -euo pipefail
          cd dragon-forge-nextgen
          python tools/build_venom_guardian.py | tee /tmp/venom-build.json
          python tools/validate_venom.py | tee /tmp/venom-validate.log
          GLTF_VALIDATOR_MODULE=/tmp/gltf/node_modules/gltf-validator node tools/validate_venom.cjs | tee /tmp/venom-gltf.log
          godot --headless --editor --import 2>&1 | tee /tmp/venom-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/venom-import.log; then exit 1; fi
      - name: Run complete inherited stack plus real Nox routing
        shell: bash
        run: |
          set -euo pipefail
          GODOT=godot bash dragon-forge-nextgen/tools/test_bosses.sh 2>&1 | tee /tmp/venom-tests.log
          grep -E 'VENOM_TESTS: [0-9]+ checks, 0 failures' /tmp/venom-tests.log
          grep -E 'VENOM_RUNTIME_TESTS: [0-9]+ checks, 0 failures' /tmp/venom-tests.log
      - name: Capture Nox in OpenGL and Forward+
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/venom-evidence
          for mode in gl_compatibility forward_plus; do
            mkdir -p "/tmp/venom-evidence/$mode"
            rm -rf dragon-forge-nextgen/artifacts/venom/captures
            timeout 240 xvfb-run -a godot --path dragon-forge-nextgen --rendering-method "$mode" --audio-driver Dummy --script res://campaign/tests/venom_capture.gd -- --test-mode 2>&1 | tee "/tmp/venom-evidence/$mode/visual.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL ' "/tmp/venom-evidence/$mode/visual.log"; then exit 1; fi
            grep 'VENOM_VISUAL: 0 failures' "/tmp/venom-evidence/$mode/visual.log"
            if [[ "$mode" == forward_plus ]]; then grep 'Forward+' "/tmp/venom-evidence/$mode/visual.log"; fi
            cp dragon-forge-nextgen/artifacts/venom/captures/*.png "/tmp/venom-evidence/$mode/"
          done
          cp /tmp/venom-*.log /tmp/venom-build.json /tmp/venom-evidence/ || true
      - name: Commit only verified runtime source and Nox exports
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/venom-runtime-integrate.yml
          git clean -fd -- ':(glob)dragon-forge-nextgen/**/*.uid' ':(glob)dragon-forge-nextgen/campaign/venom/*.import' || true
          git add dragon-forge-nextgen/campaign/dragon.gd dragon-forge-nextgen/campaign/growth.gd dragon-forge-nextgen/campaign/audio/synth.gd dragon-forge-nextgen/campaign/room.gd dragon-forge-nextgen/campaign/enemy.gd dragon-forge-nextgen/campaign/world.gd dragon-forge-nextgen/campaign/hud.gd dragon-forge-nextgen/validation/character_inspection.gd dragon-forge-nextgen/tools/test_bosses.sh dragon-forge-nextgen/campaign/venom/ .github/workflows/venom-runtime-integrate.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: awaken Nox with target-owned Toxin combat'
          git push origin HEAD:nextgen-venom-guardian
          git rev-parse HEAD > /tmp/venom-evidence/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > /tmp/venom-evidence/TESTED_TREE.txt
          git archive --format=zip -o /tmp/venom-evidence/Venom_Project_Source.zip HEAD:dragon-forge-nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venom-runtime-evidence
          path: /tmp/venom-evidence/
          retention-days: 14
