name: Validate and integrate Nox runtime
on:
  pull_request:
    paths:
      - 'dragon-forge-nextgen/**'
      - '.github/workflows/venom-runtime-v2.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-venom-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-venom-guardian
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage reviewed runtime edits
        run: |
          set -euo pipefail
          python dragon-forge-nextgen/tools/run_venom_integrator.py
          git diff --check
      - name: Install pinned authoring and validation tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          python -m pip install -r dragon-forge-nextgen/tools/art-requirements.txt
          npm install --prefix /tmp/gltf gltf-validator@2.0.0-dev.3.10
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Build and independently validate Nox
        run: |
          set -euo pipefail
          cd dragon-forge-nextgen
          python tools/build_venom_guardian.py | tee /tmp/venom-build.json
          python tools/validate_venom.py | tee /tmp/venom-validate.log
          GLTF_VALIDATOR_MODULE=/tmp/gltf/node_modules/gltf-validator node tools/validate_venom.cjs | tee /tmp/venom-gltf.log
          godot --headless --editor --import 2>&1 | tee /tmp/venom-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/venom-import.log; then exit 1; fi
      - name: Run complete inherited stack plus Nox world routing
        run: |
          set -euo pipefail
          GODOT=godot bash dragon-forge-nextgen/tools/test_bosses.sh 2>&1 | tee /tmp/venom-tests.log
          grep -E 'VENOM_TESTS: [0-9]+ checks, 0 failures' /tmp/venom-tests.log
          grep -E 'VENOM_RUNTIME_TESTS: [0-9]+ checks, 0 failures' /tmp/venom-tests.log
      - name: Capture Nox through OpenGL and Forward+
        run: |
          set -euo pipefail
          mkdir -p /tmp/venom-evidence
          for mode in gl_compatibility forward_plus; do
            target="/tmp/venom-evidence/$mode"; mkdir -p "$target"
            rm -rf dragon-forge-nextgen/artifacts/venom/captures
            timeout 240 xvfb-run -a godot --path dragon-forge-nextgen --rendering-method "$mode" --audio-driver Dummy --script res://campaign/tests/venom_capture.gd -- --test-mode 2>&1 | tee "$target/visual.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL ' "$target/visual.log"; then exit 1; fi
            grep 'VENOM_VISUAL: 0 failures' "$target/visual.log"
            if [[ "$mode" == forward_plus ]]; then grep 'Forward+' "$target/visual.log"; fi
            cp dragon-forge-nextgen/artifacts/venom/captures/*.png "$target/"
          done
          cp /tmp/venom-build.json /tmp/venom-validate.log /tmp/venom-gltf.log /tmp/venom-import.log /tmp/venom-tests.log /tmp/venom-evidence/
      - name: Commit only verified gameplay and generated Nox assets
        run: |
          set -euo pipefail
          find dragon-forge-nextgen -type f \( -name '*.uid' -o -name '*.import' \) -not -path 'dragon-forge-nextgen/art/generated/*' -delete || true
          git add \
            dragon-forge-nextgen/campaign/dragon.gd \
            dragon-forge-nextgen/campaign/growth.gd \
            dragon-forge-nextgen/campaign/audio/synth.gd \
            dragon-forge-nextgen/campaign/room.gd \
            dragon-forge-nextgen/campaign/enemy.gd \
            dragon-forge-nextgen/campaign/world.gd \
            dragon-forge-nextgen/campaign/hud.gd \
            dragon-forge-nextgen/validation/character_inspection.gd \
            dragon-forge-nextgen/campaign/venom/venom_guardian.glb \
            dragon-forge-nextgen/campaign/venom/atlas_base.png \
            dragon-forge-nextgen/campaign/venom/atlas_orm.png \
            dragon-forge-nextgen/campaign/venom/atlas_normal.png \
            dragon-forge-nextgen/campaign/venom/atlas_emission.png \
            dragon-forge-nextgen/campaign/venom/manifest.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: awaken Nox with target-owned Toxin combat'
          git push origin HEAD:nextgen-venom-guardian
          git rev-parse HEAD > /tmp/venom-evidence/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > /tmp/venom-evidence/TESTED_TREE.txt
          git archive --format=zip -o /tmp/venom-evidence/Venom_Project_Source.zip HEAD:dragon-forge-nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venom-runtime-v2-evidence
          path: /tmp/venom-evidence/
          retention-days: 14
