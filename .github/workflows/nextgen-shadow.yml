name: Nextgen Shadow guardian
on:
  pull_request:
    paths:
      - 'dragon-forge-nextgen/**'
      - '.github/workflows/nextgen-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: dragon-forge-nextgen
      - name: Install Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and run Shadow contract plus complete inherited stack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dragon-forge-nextgen/artifacts/shadow
          timeout 120 godot --headless --path dragon-forge-nextgen --editor --import 2>&1 | tee dragon-forge-nextgen/artifacts/shadow/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' dragon-forge-nextgen/artifacts/shadow/import.log; then exit 1; fi
          GODOT=godot bash dragon-forge-nextgen/tools/test_bosses.sh 2>&1 | tee dragon-forge-nextgen/artifacts/shadow/tests.log
          grep -E 'SHADOW_TESTS: [0-9]+ checks, 0 failures' dragon-forge-nextgen/artifacts/shadow/tests.log
      - name: Record exact read-only revision
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git rev-parse HEAD > dragon-forge-nextgen/artifacts/shadow/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > dragon-forge-nextgen/artifacts/shadow/TESTED_TREE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-contract-evidence
          path: dragon-forge-nextgen/artifacts/shadow/
          retention-days: 14
