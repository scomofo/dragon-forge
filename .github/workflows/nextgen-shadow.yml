name: Nextgen Shadow guardian
on:
  pull_request:
    paths:
      - 'dragon-forge-nextgen/**'
      - '.github/workflows/nextgen-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: dragon-forge-nextgen
      - name: Install Godot 4.6.3, Khronos validator and software graphics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          npm install --prefix /tmp/gltf gltf-validator@2.0.0-dev.3.10
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate committed Umbra export without rebuilding it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dragon-forge-nextgen/artifacts/shadow
          cd dragon-forge-nextgen
          python tools/validate_shadow.py | tee artifacts/shadow/export-validation.log
          grep -E 'SHADOW_EXPORTS: [0-9]+ checks, 0 failures' artifacts/shadow/export-validation.log
          GLTF_VALIDATOR_MODULE=/tmp/gltf/node_modules/gltf-validator node tools/validate_shadow.cjs | tee artifacts/shadow/gltf.log
          grep 'shadow_guardian.glb: 0 errors / 0 warnings' artifacts/shadow/gltf.log
          timeout 120 godot --headless --editor --import 2>&1 | tee artifacts/shadow/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' artifacts/shadow/import.log; then exit 1; fi
      - name: Run complete inherited stack plus Umbra world routing
        shell: bash
        run: |
          set -euo pipefail
          GODOT=godot bash dragon-forge-nextgen/tools/test_bosses.sh 2>&1 | tee dragon-forge-nextgen/artifacts/shadow/tests.log
          for marker in NEXTGEN_TESTS NEXTGEN_ART_TESTS NEXTGEN_REVIEW_TESTS NEXTGEN_POLISH_TESTS CAMPAIGN_TESTS PARTY_TESTS EVOLUTION_TESTS FUSION_TESTS TEMPEST_TESTS AUDIO_TESTS STONE_TESTS VENOM_TESTS VENOM_RUNTIME_TESTS SHADOW_TESTS SHADOW_RUNTIME_TESTS TRIAL_TESTS BOSS_TESTS; do
            grep -E "$marker: [0-9]+ checks, 0 failures" dragon-forge-nextgen/artifacts/shadow/tests.log
          done
          grep 'CAMPAIGN_CONTROLLER_PLAY: 0 failures' dragon-forge-nextgen/artifacts/shadow/tests.log
          grep 'STORM_CONTROLLER_PLAY: 0 failures' dragon-forge-nextgen/artifacts/shadow/tests.log
          grep 'BOSS_CONTROLLER_PLAY: 0 failures' dragon-forge-nextgen/artifacts/shadow/tests.log
      - name: Capture committed Umbra through OpenGL and Forward+
        shell: bash
        run: |
          set -euo pipefail
          cd dragon-forge-nextgen
          for mode in gl_compatibility forward_plus; do
            target="artifacts/shadow/$mode"
            mkdir -p "$target"
            rm -rf artifacts/shadow/captures
            timeout 240 xvfb-run -a godot --rendering-method "$mode" --audio-driver Dummy --script res://campaign/tests/shadow_capture.gd -- --test-mode 2>&1 | tee "$target/visual.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL ' "$target/visual.log"; then exit 1; fi
            grep 'SHADOW_VISUAL: 0 failures' "$target/visual.log"
            if [[ "$mode" == forward_plus ]]; then grep 'Forward+' "$target/visual.log"; fi
            cp artifacts/shadow/captures/*.png "$target/"
          done
      - name: Record exact read-only revision
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git status --porcelain --untracked-files=no | tee dragon-forge-nextgen/artifacts/shadow/tracked-status.txt
          test ! -s dragon-forge-nextgen/artifacts/shadow/tracked-status.txt
          git rev-parse HEAD > dragon-forge-nextgen/artifacts/shadow/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > dragon-forge-nextgen/artifacts/shadow/TESTED_TREE.txt
          git archive --format=zip -o dragon-forge-nextgen/artifacts/shadow/Dragon_Forge_Shadow_Editor_Project.zip HEAD:dragon-forge-nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-runtime-evidence
          path: dragon-forge-nextgen/artifacts/shadow/
          retention-days: 14
