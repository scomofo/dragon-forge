name: Integrate Forge Trials
on:
  pull_request:
    paths:
      - '.trials-transfer/**'
      - '.github/workflows/nextgen-trials-integrate.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-forge-trials'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-forge-trials
          fetch-depth: 1
      - name: Decode exact locally tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          names=['00.b64','01.b64','01b.b64','02.b64']
          parts=[pathlib.Path('.trials-transfer')/name for name in names]
          assert all(p.exists() for p in parts), 'complete transfer chunks required'
          encoded=''.join(p.read_text().strip() for p in parts)
          assert len(encoded)==21528, f'unexpected encoded length {len(encoded)}'
          payload=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(payload).hexdigest()=='0aa6f5349376e1b13139a36e29992b59fbf0d4b703d492b33dbe65a798d25073'
          assert payload.count(b'diff --git ')==11
          patch=pathlib.Path('/tmp/forge-trials.patch');patch.write_bytes(payload)
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          print('TRIAL_SOURCE: checksum verified and 11-file patch applied')
          PY
      - name: Install Godot 4.6.3 and software graphics
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and run full inherited stack
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 godot --headless --path dragon-forge-nextgen --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log; then exit 1; fi
          GODOT=godot bash dragon-forge-nextgen/tools/test_bosses.sh 2>&1 | tee /tmp/tests.log
          grep -E 'TRIAL_TESTS: [0-9]+ checks, 0 failures' /tmp/tests.log
          for marker in NEXTGEN_TESTS NEXTGEN_ART_TESTS NEXTGEN_REVIEW_TESTS NEXTGEN_POLISH_TESTS CAMPAIGN_TESTS PARTY_TESTS EVOLUTION_TESTS FUSION_TESTS TEMPEST_TESTS AUDIO_TESTS STONE_TESTS BOSS_TESTS; do
            grep -E "$marker: [0-9]+ checks, 0 failures" /tmp/tests.log
          done
          grep 'CAMPAIGN_CONTROLLER_PLAY: 0 failures' /tmp/tests.log
          grep 'STORM_CONTROLLER_PLAY: 0 failures' /tmp/tests.log
          grep 'BOSS_CONTROLLER_PLAY: 0 failures' /tmp/tests.log
      - name: Capture real Forge Trials in OpenGL and Forward+
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/trial-evidence
          for mode in gl_compatibility forward_plus; do
            target="/tmp/trial-evidence/$mode";mkdir -p "$target"
            rm -rf dragon-forge-nextgen/artifacts/trials/captures
            timeout 240 xvfb-run -a godot --path dragon-forge-nextgen --rendering-method "$mode" --audio-driver Dummy --script res://campaign/tests/trial_capture.gd -- --test-mode 2>&1 | tee "$target/visual.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|FAIL ' "$target/visual.log"; then exit 1; fi
            grep 'TRIAL_VISUAL: 0 failures' "$target/visual.log"
            if [[ "$mode" == forward_plus ]]; then grep 'Forward+' "$target/visual.log"; fi
            cp dragon-forge-nextgen/artifacts/trials/captures/*.png "$target/"
          done
      - name: Commit only verified feature source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            dragon-forge-nextgen/campaign/data.gd
            dragon-forge-nextgen/campaign/enemy.gd
            dragon-forge-nextgen/campaign/enemy_roles.gd
            dragon-forge-nextgen/campaign/hud.gd
            dragon-forge-nextgen/campaign/room.gd
            dragon-forge-nextgen/campaign/trial_store.gd
            dragon-forge-nextgen/campaign/trials.gd
            dragon-forge-nextgen/campaign/world.gd
            dragon-forge-nextgen/campaign/tests/trial_capture.gd
            dragon-forge-nextgen/campaign/tests/trial_tests.gd
            dragon-forge-nextgen/tools/test_bosses.sh
          )
          git add -- "${files[@]}"
          git rm -r -- .trials-transfer .github/workflows/nextgen-trials-integrate.yml
          git diff --cached --check
          staged=$(git diff --cached --name-only | sort)
          if printf '%s\n' "$staged" | grep -E '\.uid$|\.import$|^dragon-forge-nextgen/\.godot/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add save-isolated Forge Trials and tactical enemy roles'
          git push origin HEAD:nextgen-forge-trials
          git rev-parse HEAD > /tmp/trial-evidence/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > /tmp/trial-evidence/TESTED_TREE.txt
          git archive --format=zip -o /tmp/trial-evidence/Forge_Trials_Project_Source.zip HEAD:dragon-forge-nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-trials-integration-evidence
          path: /tmp/trial-evidence/
          retention-days: 14
