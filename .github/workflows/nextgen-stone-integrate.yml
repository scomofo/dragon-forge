name: Integrate Cairn Stone guardian
on:
  pull_request:
    paths:
      - '.stone-transfer/**'
      - '.github/workflows/nextgen-stone-integrate.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-stone-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_SILENCE_ROOT_WARNING: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-stone-guardian
          fetch-depth: 1
      - name: Decode exact tested Cairn source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,pathlib,zlib,subprocess
          names=['00.b64','01.b64','02a.b64','02b.b64','02c.b64','02d.b64']
          parts=[pathlib.Path('.stone-transfer')/n for n in names]
          assert all(p.exists() for p in parts), 'complete verified transfer chunks required'
          encoded=''.join(p.read_text() for p in parts)
          assert len(encoded)==33116, f'unexpected encoded length {len(encoded)}'
          payload=zlib.decompress(base64.b64decode(encoded,validate=True))
          expected='1879012713a4ba7517eca0094bae7c91d725b83b74ecb13d999ff53a662a91db'
          assert hashlib.sha256(payload).hexdigest()==expected, 'source patch checksum mismatch'
          patch=pathlib.Path('/tmp/stone-source.patch'); patch.write_bytes(payload)
          subprocess.run(['git','apply','--check','--directory=dragon-forge-nextgen',str(patch)],check=True)
          subprocess.run(['git','apply','--directory=dragon-forge-nextgen',str(patch)],check=True)
          print('CAIRN_SOURCE: checksum verified and applied')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned authoring and validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          python -m pip install -r dragon-forge-nextgen/tools/art-requirements.txt
          npm install --prefix /tmp/gltf gltf-validator@2.0.0-dev.3.10
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Bake and validate Cairn assets
        shell: bash
        run: |
          set -euo pipefail
          cd dragon-forge-nextgen
          python tools/build_stone_guardian.py
          python tools/validate_stone.py
          GLTF_VALIDATOR_MODULE=/tmp/gltf/node_modules/gltf-validator node tools/validate_stone.cjs
          godot --headless --editor --import 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log; then exit 1; fi
      - name: Run full inherited regression stack
        shell: bash
        run: |
          set -euo pipefail
          GODOT=godot bash dragon-forge-nextgen/tools/test_bosses.sh | tee /tmp/tests.log
          grep 'STONE_TESTS: 0 failures' /tmp/tests.log
      - name: Render Cairn in OpenGL and Forward+
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/captures
          for mode in gl_compatibility forward_plus; do
            mkdir -p "/tmp/captures/$mode"
            timeout 240 xvfb-run -a godot --path dragon-forge-nextgen --rendering-method "$mode" --audio-driver Dummy --script res://campaign/tests/stone_capture.gd -- --test-mode 2>&1 | tee "/tmp/captures/$mode.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|FAIL ' "/tmp/captures/$mode.log"; then exit 1; fi
            mv dragon-forge-nextgen/artifacts/stone/captures/*.png "/tmp/captures/$mode/"
          done
      - name: Commit only verified source and generated Stone assets
        shell: bash
        run: |
          set -euo pipefail
          git add dragon-forge-nextgen
          git rm -r .stone-transfer .github/workflows/nextgen-stone-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: awaken Cairn with Stone Resonance and Resolve combat'
          git push origin HEAD:nextgen-stone-guardian
          git rev-parse HEAD > /tmp/captures/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > /tmp/captures/TESTED_TREE.txt
          git archive --format=zip -o /tmp/captures/Cairn_Project_Source.zip HEAD:dragon-forge-nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cairn-integration-evidence
          path: /tmp/captures/
          retention-days: 14
