name: Repair Venom runtime integrator
on:
  pull_request:
    paths:
      - '.github/workflows/venom-integrator-hotfix.yml'
permissions:
  contents: read
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-venom-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-venom-guardian
          fetch-depth: 1
      - name: Remove only the now-redundant runner replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/venom-runtime-integrate.yml')
          text=p.read_text()
          old='''          rep('dragon-forge-nextgen/tools/test_bosses.sh','campaign/tests/venom_tests.gd campaign/tests/boss_tests.gd',\n              'campaign/tests/venom_tests.gd campaign/tests/venom_runtime_tests.gd campaign/tests/boss_tests.gd')\n'''
          assert text.count(old)==1, 'expected one redundant runner replacement'
          p.write_text(text.replace(old,'',1))
          PY
          rm -f .github/workflows/venom-integrator-hotfix.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: let permanent runner own Nox runtime acceptance'
          git push origin HEAD:nextgen-venom-guardian
