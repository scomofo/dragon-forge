name: Apply Cairn release-facing package checks
on:
  pull_request:
    paths:
      - '.cairn-release.patch'
      - '.github/workflows/cairn-release-apply.yml'
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-stone-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-stone-guardian
          fetch-depth: 1
      - name: Apply checked Cairn release patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .cairn-release.patch
          git apply .cairn-release.patch
          rm -f .cairn-release.patch .github/workflows/cairn-release-apply.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'release: verify Cairn in schema-6 standalone packages'
          git push origin HEAD:nextgen-stone-guardian
