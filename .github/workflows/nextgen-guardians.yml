name: Nextgen guardian party
on:
  pull_request:
    paths:
      - '.guardian-transfer/**'
      - 'dragon-forge-nextgen/**'
      - '.github/workflows/nextgen-guardians.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-guardian-party'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: |
            dragon-forge-nextgen
            .guardian-transfer
      - name: Apply the exact locally tested source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          root=pathlib.Path('.guardian-transfer')
          parts=sorted(root.glob('0?.b64'))
          assert len(parts)==7, 'Expected complete transfer; do not reapply after integration'
          payload=zlib.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(payload).hexdigest()=='ec9e3c19e6c64acb39abf58f3a723e2cf20a1d05532d68d5843280156707d82c'
          patch=pathlib.Path('/tmp/guardians.patch'); patch.write_bytes(payload)
          files=[line[6:] for line in payload.decode().splitlines() if line.startswith('+++ b/')]
          assert len(files)==21 and all(p.startswith('dragon-forge-nextgen/') and '..' not in pathlib.PurePosixPath(p).parts for p in files)
          pathlib.Path('/tmp/guardian-files.json').write_text(json.dumps(files))
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          print('Exact source transfer verified and applied')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated authoring and validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
          python -m pip install -r dragon-forge-nextgen/tools/art-requirements.txt
          npm install --prefix /tmp/guardian-validator gltf-validator@2.0.0-dev.3.10
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Bake the Ice guardian and test actual gameplay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dragon-forge-nextgen/artifacts/guardians
          python dragon-forge-nextgen/tools/build_ice_guardian.py
          GLTF_VALIDATOR_MODULE=/tmp/guardian-validator/node_modules/gltf-validator node dragon-forge-nextgen/tools/validate_guardians.cjs 2>&1 | tee dragon-forge-nextgen/artifacts/guardians/exports.log
          python dragon-forge-nextgen/tools/validate_art.py 2>&1 | tee dragon-forge-nextgen/artifacts/guardians/original-exports.log
          timeout 100 godot --headless --path dragon-forge-nextgen --editor --import 2>&1 | tee dragon-forge-nextgen/artifacts/guardians/import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' dragon-forge-nextgen/artifacts/guardians/import.log; then exit 1; fi
          for script in tests/run.gd tests/art_test.gd validation/review_tests.gd validation/polish_tests.gd campaign/tests/run.gd campaign/tests/party_tests.gd campaign/tests/play_smoke.gd; do
            log="dragon-forge-nextgen/artifacts/guardians/$(echo "$script" | tr / _).log"
            timeout 150 godot --headless --fixed-fps 60 --path dragon-forge-nextgen --script "res://$script" -- --test-mode 2>&1 | tee "$log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL ' "$log"; then exit 1; fi
          done
      - name: Capture the actual campaign and imported Ice model
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 xvfb-run -a godot --path dragon-forge-nextgen --rendering-method gl_compatibility --audio-driver Dummy --script res://campaign/tests/party_capture.gd -- --test-mode 2>&1 | tee dragon-forge-nextgen/artifacts/guardians/visual.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' dragon-forge-nextgen/artifacts/guardians/visual.log; then exit 1; fi
          grep 'GUARDIAN_VISUAL: 0 failures' dragon-forge-nextgen/artifacts/guardians/visual.log
      - name: Commit only validated source and exports to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,subprocess
          files=json.loads(pathlib.Path('/tmp/guardian-files.json').read_text())
          assets=pathlib.Path('dragon-forge-nextgen/campaign/guardians')
          files += [str(p) for p in assets.iterdir() if p.suffix in ['.png','.glb','.json']]
          assert len(files)==28
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','rm','-r','--','.guardian-transfer'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: ship Rime rescue, four-legged guardian assets and independent party combat'
          git push origin HEAD:refs/heads/nextgen-guardian-party
          git rev-parse HEAD > dragon-forge-nextgen/artifacts/guardians/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > dragon-forge-nextgen/artifacts/guardians/TESTED_TREE.txt
          git archive --format=zip -o dragon-forge-nextgen/artifacts/guardians/Guardian_Project_Source.zip HEAD:dragon-forge-nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-party-integration
          path: dragon-forge-nextgen/artifacts/guardians/
          retention-days: 14
