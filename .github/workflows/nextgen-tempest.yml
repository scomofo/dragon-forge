name: Nextgen Tempest and audio
on:
  pull_request:
    paths:
      - 'dragon-forge-nextgen/**'
      - '.github/workflows/nextgen-tempest.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tempest-audio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tempest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GODOT_SILENCE_ROOT_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dragon-forge-nextgen
            public/assets/music
      - name: Install isolated validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri mesa-vulkan-drivers
          npm install --prefix /tmp/tempest-validator gltf-validator@2.0.0-dev.3.10
          curl --fail --location --retry 3 'https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip' -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Validate committed art and original audio bytes without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dragon-forge-nextgen/artifacts/tempest
          python3 dragon-forge-nextgen/tools/validate_tempest.py | tee dragon-forge-nextgen/artifacts/tempest/exports.log
          python3 dragon-forge-nextgen/tools/validate_art.py | tee dragon-forge-nextgen/artifacts/tempest/original-exports.log
          python3 dragon-forge-nextgen/tools/validate_evolutions.py | tee dragon-forge-nextgen/artifacts/tempest/evolved-exports.log
          GLTF_VALIDATOR_MODULE=/tmp/tempest-validator/node_modules/gltf-validator node dragon-forge-nextgen/tools/validate_tempest.cjs
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('dragon-forge-nextgen/campaign/audio')
          manifest=json.loads((root/'manifest.json').read_text())
          assert len(manifest['tracks'])==10
          for track in manifest['tracks']:
              b=(root/'music'/track['file']).read_bytes()
              assert len(b)==track['bytes'] and hashlib.sha256(b).hexdigest()==track['sha256']
              assert b==pathlib.Path(track['source']).read_bytes()
          result={'recordings':10,'original_bytes_preserved':True,'battle_native_extension':'wav'}
          pathlib.Path('dragon-forge-nextgen/artifacts/tempest/provenance.json').write_text(json.dumps(result,indent=2))
          print('AUDIO_PROVENANCE: ten original recordings preserved byte-for-byte')
          PY
      - name: Native regressions and real PCM mixer verification
        shell: bash
        run: |
          set -euo pipefail
          bash dragon-forge-nextgen/tools/test_tempest.sh
          timeout 60 godot --headless --path dragon-forge-nextgen --script res://campaign/tests/audio_capture.gd -- --test-mode 2>&1 | tee dragon-forge-nextgen/artifacts/tempest/audio-capture.log
          grep 'NATIVE_AUDIO_CAPTURE: 0 failures' dragon-forge-nextgen/artifacts/tempest/audio-capture.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:|^FAIL ' dragon-forge-nextgen/artifacts/tempest/audio-capture.log; then exit 1; fi
      - name: Actual OpenGL and Forward+ captures
        shell: bash
        run: |
          set -euo pipefail
          for mode in gl_compatibility forward_plus; do
            target="dragon-forge-nextgen/artifacts/tempest/$mode"
            mkdir -p "$target"
            timeout 240 xvfb-run -a godot --path dragon-forge-nextgen --rendering-method "$mode" --audio-driver Dummy --script res://campaign/tests/tempest_capture.gd -- --test-mode 2>&1 | tee "$target/visual.log"
            grep 'TEMPEST_VISUAL: 0 failures' "$target/visual.log"
            if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' "$target/visual.log"; then exit 1; fi
            mv dragon-forge-nextgen/artifacts/tempest/captures/*.png "$target/"
          done
      - name: Archive unchanged tested project
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git rev-parse HEAD > dragon-forge-nextgen/artifacts/tempest/TESTED_COMMIT.txt
          git rev-parse HEAD:dragon-forge-nextgen > dragon-forge-nextgen/artifacts/tempest/TESTED_TREE.txt
          git archive --format=zip -o dragon-forge-nextgen/artifacts/tempest/Tempest_Project_Source.zip HEAD:dragon-forge-nextgen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempest-audio-evidence
          path: dragon-forge-nextgen/artifacts/tempest/
          retention-days: 14
