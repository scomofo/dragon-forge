name: Apply remaining Shadow migration expectations
on:
  pull_request:
    paths:
      - '.github/workflows/shadow-evolution-schema-fix.yml'
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-shadow-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-shadow-guardian
          fetch-depth: 1
      - name: Preserve v1/v2 inputs while updating current-schema expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dragon-forge-nextgen/campaign/tests/evolution_tests.gd')
          text=p.read_text()
          reps=[
            ('migrated.version==7 and migrated.evolutions=={"fire":"","ice":"","storm":""}',
             'migrated.version==8 and migrated.evolutions=={"fire":"","ice":"","storm":""}'),
            ('version %d migrates without auto-evolving through schema 7',
             'version %d migrates without auto-evolving through schema 8'),
            ('loaded.version==7, "migration reaches schema 7 without writing on load"',
             'loaded.version==8, "migration reaches schema 8 without writing on load"'),
          ]
          for old,new in reps:
              count=text.count(old)
              assert count==1, f'expected one {old!r}, got {count}'
              text=text.replace(old,new,1)
          p.write_text(text)
          PY
          rm -f .github/workflows/shadow-evolution-schema-fix.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: carry evolution migrations through schema 8'
          git push origin HEAD:nextgen-shadow-guardian
