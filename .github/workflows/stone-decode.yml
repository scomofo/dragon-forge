name: Decode Stone source transfer
on:
  pull_request:
    paths:
      - '.stone-transfer/**'
      - '.github/workflows/stone-decode.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decode:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-stone-guardian
          sparse-checkout: |
            .stone-transfer
      - name: Decode staged source patch
        run: |
          python3 - <<'PY'
          import base64, pathlib, zlib, hashlib
          parts=sorted(pathlib.Path('.stone-transfer').glob('*.b64'))
          data=''.join(p.read_text().strip() for p in parts)
          raw=base64.b64decode(data, validate=True)
          try:
              payload=zlib.decompress(raw)
          except Exception as exc:
              pathlib.Path('/tmp/decode-error.txt').write_text(f'{type(exc).__name__}: {exc}\nparts={len(parts)} raw={len(raw)} sha256={hashlib.sha256(raw).hexdigest()}\n')
              raise
          pathlib.Path('/tmp/stone.patch').write_bytes(payload)
          pathlib.Path('/tmp/stone-meta.txt').write_text(f'parts={len(parts)}\nbytes={len(payload)}\nsha256={hashlib.sha256(payload).hexdigest()}\n')
          print(pathlib.Path('/tmp/stone-meta.txt').read_text())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoded-stone-source
          path: |
            /tmp/stone.patch
            /tmp/stone-meta.txt
            /tmp/decode-error.txt
          retention-days: 1
