name: Restore base tracked art imports
on:
  pull_request:
    paths:
      - '.github/workflows/stone-restore-imports.yml'
permissions:
  contents: read
jobs:
  restore:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-stone-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-stone-guardian
          fetch-depth: 0
      - name: Restore only import metadata that existed before Cairn
        shell: bash
        run: |
          set -euo pipefail
          git checkout b6f43587173bb4f0747a2df2cb96b6821dfb4595 -- ':(glob)dragon-forge-nextgen/art/generated/*.import'
          rm -f .github/workflows/stone-restore-imports.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: restore base-tracked art import metadata'
          git push origin HEAD:nextgen-stone-guardian
