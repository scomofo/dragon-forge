name: Nextgen art validation
on:
  pull_request:
    paths:
      - '.github/workflows/nextgen-art.yml'
      - 'dragon-forge-nextgen/art/**'
      - 'dragon-forge-nextgen/tools/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validator:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'nextgen-production-art'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare official Khronos glTF validator
        run: |
          set -euo pipefail
          mkdir -p validator
          npm pack gltf-validator --pack-destination validator
      - uses: actions/upload-artifact@v4
        with:
          name: art-validation-package
          path: validator/*.tgz
          retention-days: 1
