name: Apply Shadow fusion migration expectations
on:
  pull_request:
    paths:
      - '.github/workflows/shadow-fusion-schema-fix.yml'
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'nextgen-shadow-guardian'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nextgen-shadow-guardian
          fetch-depth: 1
      - name: Keep v1-v3 fixtures while expecting current schema 8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('dragon-forge-nextgen/campaign/tests/fusion_tests.gd')
          text=p.read_text()
          old='migrated.version==7 and not migrated.storm_forged and not migrated.lattice_recovered,"old version %d reaches schema 7 with no unearned fusion"%version'
          new='migrated.version==8 and not migrated.storm_forged and not migrated.lattice_recovered and not migrated.shadow_forged,"old version %d reaches schema 8 with no unearned fusion or Shadow"%version'
          assert text.count(old)==1
          p.write_text(text.replace(old,new,1))
          PY
          rm -f .github/workflows/shadow-fusion-schema-fix.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: carry fusion migrations through schema 8'
          git push origin HEAD:nextgen-shadow-guardian
